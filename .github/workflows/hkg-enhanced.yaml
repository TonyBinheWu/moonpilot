name: HKG enhanced checks

on:
  push:
    branches: [hkg-enhanced]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-and-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load pinned opendbc
        run: git submodule update --init opendbc_repo
      - name: Install verification dependencies
        run: pip install -e ./opendbc_repo pytest cffi ruff
      - name: Navigation, signal intent and schemas
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s openpilot/sunnypilot/navd/tests -v
      - name: HKG controller and CAN-FD safety regression
        run: python -m pytest -q opendbc_repo/opendbc/safety/tests/test_hyundai_canfd.py opendbc_repo/opendbc/safety/tests/test_hyundai_canfd_blinkers.py opendbc_repo/opendbc/sunnypilot/car/hyundai/tests
